name: Feature request
description: Suggest a new capability or enhancement
title: "Feature: "
labels: ["✨ Type: Feature"]
assignees: ["vlavrynovych"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs this and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include example API or CLI usage when helpful.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Current MSR Core version
      placeholder: "e.g. 0.8.4"
  - type: input
    id: database
    attributes:
      label: Database and adapter, if relevant
  - type: dropdown
    id: implementation
    attributes:
      label: Willing to implement this feature?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
