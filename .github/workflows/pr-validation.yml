name: PR title validation

on:
  pull_request:
    branches: [master, develop, 'release/*']
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node - <<'NODE'
          const title = process.env.PR_TITLE || '';
          const taskTitle = /^#[1-9][0-9]*: [A-Z].+$/;
          const releaseTitle = /^Release v[0-9]+\.[0-9]+\.[0-9]+$/;
          if (!taskTitle.test(title) && !releaseTitle.test(title)) {
            console.error('Use "#<issue>: <imperative title>" or "Release vX.Y.Z".');
            process.exit(1);
          }
          NODE
