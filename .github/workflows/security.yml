name: Security audit

on:
  push:
    branches: [master, develop, 'release/*']
  pull_request:
    branches: [master, develop, 'release/*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
